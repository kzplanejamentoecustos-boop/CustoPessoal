function getProj(txs,_bills,_bp,month){
  const proj=[];
  const grps={};
  txs.forEach(t=>{if(!t.groupId||!t.installments)return;if(!grps[t.groupId])grps[t.groupId]={inst:t.installments,exist:{},base:t};grps[t.groupId].exist[t.installmentOf]=mOf(t.date);});
  Object.values(grps).forEach(({inst,exist,base})=>{
    const minI=Math.min(...Object.keys(exist).map(Number));
    const[y,m]=exist[minI].split("-").map(Number);
    for(let i=1;i<=inst;i++){if(exist[i])continue;const diff=i-minI;const d=new Date(y,m-1+diff,1);const em=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(em!==month)continue;proj.push({...base,id:`pj-${base.groupId}-${i}`,date:`${em}-01`,installmentOf:i,isProj:true,projType:"inst"});}
  });
  const recG={};
  txs.forEach(t=>{if(!t.recurring||t.type!=="income")return;const k=`${t.desc}||${t.catId}||${t.amount}`;if(!recG[k])recG[k]={base:t,months:[]};recG[k].months.push(mOf(t.date));});
  Object.values(recG).forEach(({base,months})=>{if(months.includes(month))return;const last=months.sort().pop();if(!last||month<=last)return;const[ly,lm]=last.split("-").map(Number);const[py,pm]=month.split("-").map(Number);if((py-ly)*12+(pm-lm)>12)return;proj.push({...base,id:`pj-rec-${base.id}-${month}`,date:`${month}-01`,isProj:true,projType:"rec"});});
  return proj;
}

// ── PDF builder ──
function buildPdf(state,month,cats,payAccs,bills,billPay){
  const catById=id=>cats.find(c=>c.id===id);
  const payById=id=>payAccs.find(p=>p.id===id);
  const fB=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const txs=state.transactions.filter(t=>mOf(t.date)===month).sort((a,b)=>b.date.localeCompare(a.date));
  const expenses=txs.filter(t=>t.type==="expense").reduce((a,t)=>a+t.amount,0);
  const incomes=txs.filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0);
  const balance=incomes-expenses;
  const savRate=incomes>0?(balance/incomes*100):0;
  const expC=cats.filter(c=>c.type==="expense");
  const incC=cats.filter(c=>c.type==="income");
  const catExpT=expC.map(c=>({...c,val:txs.filter(t=>t.type==="expense"&&t.catId===c.id).reduce((a,t)=>a+t.amount,0)})).filter(c=>c.val>0).sort((a,b)=>b.val-a.val);
  const catIncT=incC.map(c=>({...c,val:txs.filter(t=>t.type==="income"&&t.catId===c.id).reduce((a,t)=>a+t.amount,0)})).filter(c=>c.val>0).sort((a,b)=>b.val-a.val);
  const payExpT=payAccs.map(p=>({...p,val:txs.filter(t=>t.type==="expense"&&t.payAccId===p.id).reduce((a,t)=>a+t.amount,0)})).filter(p=>p.val>0).sort((a,b)=>b.val-a.val);
  const mPay=(billPay||{})[month]||{};
  const billsTotal=bills.reduce((a,b)=>a+b.amount,0);
  const billsPaidT=bills.filter(b=>mPay[b.id]).reduce((a,b)=>a+b.amount,0);
  const healthLabel=savRate>=20?"Ótima":savRate>=10?"Boa":savRate>=0?"Atenção":"Negativa";
  const healthColor=savRate>=20?"#059669":savRate>=10?"#d97706":savRate>=0?"#ea580c":"#dc2626";

  const barRow=(label,val,total,color,icon="")=>`
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:#334155;font-weight:500">${icon} ${label}</span>
        <div style="display:flex;gap:12px;align-items:center">
          <span style="font-size:11px;color:#94a3b8">${total>0?(val/total*100).toFixed(0):0}%</span>
          <span style="font-size:12px;font-weight:700;color:${color}">${fB(val)}</span>
        </div>
      </div>
      <div style="background:#e2e8f0;border-radius:4px;height:6px"><div style="background:${color};border-radius:4px;height:6px;width:${total>0?Math.min(val/total*100,100):0}%"></div></div>
    </div>`;

  return`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Relatório — ${mFull(month)}</title>
<style>
  @page{size:A4;margin:15mm 18mm}

  .page{max-width:780px;margin:0 auto;padding:24px}
  /* header */
  .report-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;margin-bottom:20px;border-bottom:2px solid #e2e8f0}
  .logo{font-size:13px;font-weight:700;color:#4f46e5;margin-bottom:5px;letter-spacing:-.2px}
  .report-title{font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-1px;margin-bottom:3px}
  .report-sub{font-size:13px;color:#64748b}
  .meta{text-align:right;font-size:12px;color:#64748b}
  .meta strong{color:#1e293b;display:block;font-size:13px}
  /* kpis */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .kpi{background:#f8fafc;border-radius:10px;padding:14px 16px;border:1px solid #e2e8f0}
  .kpi-label{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .kpi-val{font-size:18px;font-weight:800;letter-spacing:-0.5px}
  .kpi-sub{font-size:10px;font-weight:700;margin-top:3px}
  /* sections */
  .section{background:#f8fafc;border-radius:10px;padding:16px 18px;border:1px solid #e2e8f0;margin-bottom:14px}
  .section-title{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #e2e8f0}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  /* table */
  .tx-table{width:100%;border-collapse:collapse;margin-top:0}
  .tx-table th{padding:8px 10px;background:#f1f5f9;font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1px solid #e2e8f0}
  .tx-table th:last-child{text-align:right}
  .tx-table td{padding:9px 10px;font-size:12px;border-bottom:1px solid #f1f5f9;color:#334155}
  .tx-table td:last-child{text-align:right;font-weight:700;white-space:nowrap}

</style>

  const fbWait=()=>new Promise(res=>{if(window.FB&&window.FB.ready)return res();window.addEventListener("fb-ready",()=>res(),{once:true});setTimeout(res,4000);});
  const fbCall=(p,ms=8000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("Tempo esgotado ao falar com o Firebase. Verifique: 1) se o Firestore Database foi criado no console do Firebase, 2) as regras de segurança, 3) bloqueadores de anúncio/rede.")),ms))]);

  const fbAssertReady=async()=>{await fbWait();if(!window.FB)throw new Error("Firebase não inicializou (script bloqueado por adblock/rede?).");};
  const fbDocRef=name=>window.FB.doc(window.FB.db,FB_COLLECTION,name);

  const saveFirebase=async(name,data)=>{

  };
  const loadFirebaseByName=async name=>{
    await fbAssertReady();
    let snap;
    try{snap=await fbCall(window.FB.getDoc(fbDocRef(name)));}
    catch(err){console.error("[Firebase] erro ao carregar:",err);throw err;}
    if(!snap.exists())throw new Error(`Perfil "${name}" não encontrado no Firebase.`);
    return snap.data();
  };
  const listFirebaseProfiles=async()=>{
    await fbAssertReady();
    let snap;
    try{snap=await fbCall(window.FB.getDocs(window.FB.collection(window.FB.db,FB_COLLECTION)));}
    catch(err){console.error("[Firebase] erro ao listar perfis:",err);throw err;}
    return snap.docs.map(d=>{const v=d.data()||{};return{id:d.id,userName:v.userName||d.id,updatedAt:v._updatedAt||null,txCount:(v.transactions||[]).length};}).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  };

  const openCloudList=async()=>{
    setCloudMod(true);setCloudLoading(true);setCloudNameV("");
    try{setCloudList(await listFirebaseProfiles());}

  const sanitizeProfileName=n=>(n||"").trim().replace(/[\/\\]/g,"-").replace(/\s+/g," ").slice(0,150);

  };
  const saveAndDownload=()=>{dlJson(state,jFile);notify("💾 Arquivo .json baixado");};
  const newFile=()=>{if(dirty&&!window.confirm("Alterações não salvas. Continuar?"))return;setState({...INIT});setJFile("fincontrol-dados.json");setDirty(false);setLoaded(true);notify("📄 Novo arquivo criado");};
  const genPdf=()=>{const html=buildPdf(state,month,cats,payAccs,bills,billPay);const w=window.open("","_blank","width=900,height=700");w.document.write(html);w.document.close();};

  const projs=useMemo(()=>getProj(state.transactions,bills,billPay,month),[state.transactions,bills,billPay,month]);
  const allTx=useMemo(()=>{const real=state.transactions.filter(t=>mOf(t.date)===month);return showProj?[...real,...projs]:real;},[state.transactions,projs,month,showProj]);
  const filteredTx=useMemo(()=>{
    const base=allTx.filter(t=>!t.isBill).filter(t=>catF==="all"||t.catId===catF).filter(t=>payF==="all"||t.payAccId===payF);
    if(sortMode==="paycat"){
      return [...base].sort((a,b)=>{
        const pa=payById(a.payAccId)?.name||"zzz",pb=payById(b.payAccId)?.name||"zzz";
        if(pa!==pb)return pa.localeCompare(pb);
        const ca=catById(a.catId)?.name||"zzz",cb=catById(b.catId)?.name||"zzz";
        if(ca!==cb)return ca.localeCompare(cb);
        return b.date.localeCompare(a.date);
      });
    }
    return [...base].sort((a,b)=>b.date.localeCompare(a.date)||(String(b.id)>String(a.id)?1:-1));
  },[allTx,catF,payF,sortMode]);

  const realTx=allTx.filter(t=>!t.isBill);
  // For dedup: if dedupCardAmount set → only dedup that partial amount; else dedup full amount
  const effAmount=t=>t.type!=="expense"?t.amount:t.dedupCard?(t.dedupCardAmount!=null?t.amount-t.dedupCardAmount:0):t.amount;

  const filteredExp=filteredTx.filter(t=>t.type==="expense").reduce((a,t)=>a+effAmount(t),0);
  const filteredInc=filteredTx.filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0);

  const expenses=realTx.filter(t=>t.type==="expense").reduce((a,t)=>a+effAmount(t),0);
  const incomes=realTx.filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0);
  const balance=incomes-expenses;
  const savRate=incomes>0?(balance/incomes*100):0;
  const health=savRate>=20?{l:"Ótima",c:T.green}:savRate>=10?{l:"Boa",c:T.amber}:savRate>=0?{l:"Atenção",c:"#ea580c"}:{l:"Negativa",c:T.red};

  const catIncT=incCats.map(c=>({...c,val:realTx.filter(t=>t.type==="income"&&t.catId===c.id).reduce((a,t)=>a+t.amount,0)})).filter(c=>c.val>0).sort((a,b)=>b.val-a.val);
  const catExpT=expCats.map(c=>({...c,val:realTx.filter(t=>t.type==="expense"&&t.catId===c.id).reduce((a,t)=>a+effAmount(t),0)})).filter(c=>c.val>0).sort((a,b)=>b.val-a.val);
  const payExpT=payAccs.map(p=>({...p,val:realTx.filter(t=>t.type==="expense"&&t.payAccId===p.id).reduce((a,t)=>a+effAmount(t),0)})).filter(p=>p.val>0).sort((a,b)=>b.val-a.val);
  const budgetCats=expCats.filter(c=>c.budget>0).map(c=>{
    const val=realTx.filter(t=>t.type==="expense"&&t.catId===c.id).reduce((a,t)=>a+effAmount(t),0);
    const pct=c.budget>0?val/c.budget*100:0;
    return{...c,val,pct,over:val>c.budget};

  const overBudgetCats=budgetCats.filter(c=>c.over);

  const chartData=useMemo(()=>Array.from({length:10},(_,i)=>i-6).map(i=>{const m=addM(mNow(),i);const txs=state.transactions.filter(t=>mOf(t.date)===m&&!t.isBill);const p=getProj(state.transactions,[],[],m).filter(t=>!t.isBill);const all=[...txs,...p];return{month:m,income:all.filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0),expense:all.filter(t=>t.type==="expense").reduce((a,t)=>a+t.amount,0)};}),[ state.transactions]);

  const instGroups=useMemo(()=>{
    const g={};
    state.transactions.forEach(t=>{
      if(!t.groupId||!t.installments||t.installments<=1)return;
      if(!g[t.groupId])g[t.groupId]={groupId:t.groupId,desc:t.desc,catId:t.catId,payAccId:t.payAccId,amount:t.amount,total:t.installments,items:[]};
      g[t.groupId].items.push(t);
    });
    const td=month===mNow()?today():month+"-31";
    return Object.values(g).map(grp=>{
      const items=grp.items.slice().sort((a,b)=>a.installmentOf-b.installmentOf);
      const byInst={};
      items.forEach(i=>{byInst[i.installmentOf]=i;});
      const anchorInst=items[0].installmentOf;
      const[ay,am]=items[0].date.split("-").map(Number);
      // Data de cada parcela: usa a data real quando o registro existe; senão projeta mensalmente a partir da primeira parcela rastreada (mesma lógica de getProj)
      const dateFor=i=>{
        if(byInst[i])return byInst[i].date;
        const diff=i-anchorInst;
        const d=new Date(ay,am-1+diff,1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
      };
      let paidCount=0,nextItem=null;
      for(let i=1;i<=grp.total;i++){
        const dt=dateFor(i);
        if(dt<=td)paidCount++;
        else if(!nextItem)nextItem={date:dt};
      }
      const remainingCount=grp.total-paidCount;
      const paidValue=paidCount*grp.amount;
      const remainingValue=remainingCount*grp.amount;
      const totalValue=grp.total*grp.amount;
      const lastItem={date:dateFor(grp.total)};
      return{...grp,items,paidCount,remainingCount,paidValue,remainingValue,totalValue,nextItem,lastItem,done:remainingCount<=0};
    }).sort((a,b)=>(a.done===b.done?0:a.done?1:-1)||a.lastItem.date.localeCompare(b.lastItem.date));
  },[state.transactions,month]);
  const instFiltered=instGroups.filter(g=>(instPayF==="all"||g.payAccId===instPayF)&&(instShowDone||!g.done));

  const instRemainingTotal=instGroups.filter(g=>!g.done).reduce((a,g)=>a+g.remainingValue,0);

      }
    }
    else if(total>1){const start=Math.max(1,Math.min(total,parseInt(txF.startInst)||1));const gid=Date.now();upd({transactions:[...state.transactions,...Array.from({length:total-start+1},(_,i)=>{const d=new Date(txF.date);d.setMonth(d.getMonth()+i);return{id:gid+i,...base,date:d.toISOString().split("T")[0],installments:total,installmentOf:start+i,groupId:gid,recurring:false};})]});}
    else upd({transactions:[...state.transactions,{id:Date.now(),...base}]});
    setTxMod(false);setShowCalc(false);setCalcExpr("");setCalcResult("");
  };
  const delTx=t=>upd({transactions:state.transactions.filter(x=>x.id!==t.id)});
  const delGrp=t=>upd({transactions:state.transactions.filter(x=>x.groupId!==t.groupId)});

  const openNewGoal=()=>{setGoalF(blankGoal);setGoalMod("new");};
  const openEditGoal=g=>{setGoalF({name:g.name,target:String(g.target),saved:String(g.saved),type:g.type,deadline:g.deadline||"",notes:g.notes||""});setGoalMod(g);};
  const saveGoal=()=>{if(!goalF.name.trim()||!goalF.target)return;const g={...goalF,target:parseFloat(goalF.target),saved:parseFloat(goalF.saved||0)};if(goalMod!=="new")upd({goals:state.goals.map(x=>x.id===goalMod.id?{...x,...g}:x)});else upd({goals:[...state.goals,{id:Date.now(),...g,checklist:[]}]});setGoalMod(false);};
  const updGoal=g=>{upd({goals:state.goals.map(x=>x.id===g.id?g:x)});setChkGoal(g);};
  const doDep=()=>{const v=parseFloat(depVal);if(!v||v<=0)return;upd({goals:state.goals.map(g=>g.id===depMod.id?{...g,saved:Math.min(g.saved+v,g.target)}:g)});setDepMod(null);setDepVal("");};

  const saveBill=()=>{if(!billF.name.trim()||!billF.amount)return;const b={...billF,amount:parseFloat(billF.amount),dueDay:parseInt(billF.dueDay)||10};if(editBillId)upd({bills:bills.map(x=>x.id===editBillId?{...x,...b}:x)});else upd({bills:[...bills,{id:Date.now(),...b}]});setBillF(blankBill);setEditBillId(null);setBillMod(false);};
  const editBill=b=>{setBillF({name:b.name,amount:String(b.amount),category:b.category,dueDay:b.dueDay});setEditBillId(b.id);setBillMod(true);};

  const assets=state.assets||[];
  const saveAsset=()=>{if(!assetF.name.trim()||!assetF.value)return;const a={name:assetF.name.trim(),type:assetF.type,value:parseFloat(assetF.value),notes:assetF.notes};if(editAssetId)upd({assets:assets.map(x=>x.id===editAssetId?{...x,...a}:x)});else upd({assets:[...assets,{id:Date.now(),...a}]});setAssetF(blankAsset);setEditAssetId(null);setAssetMod(false);};
  const editAsset=a=>{setAssetF({name:a.name,type:a.type,value:String(a.value),notes:a.notes||""});setEditAssetId(a.id);setAssetMod(true);};

  const totalDebtsVal=assets.filter(a=>a.type==="divida").reduce((s,a)=>s+a.value,0);
  const netWorth=totalAssetsVal-totalDebtsVal;

  const delCat=id=>{if(state.transactions.some(t=>t.catId===id)){alert("Possui lançamentos. Remova antes.");return;}upd({categories:cats.filter(c=>c.id!==id)});};

  const TABS=["Dashboard","Lançamentos","Metas","Contas","Parcelamentos","Patrimônio"];
  const TAB_ICONS=["dashboard","swap","target","calendar","card","wallet"];

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {cloudLoading?(
          <div style={{textAlign:"center",padding:24,color:T.dim,fontSize:12}}>⏳ Carregando lista de perfis...</div>
        ):(
          <>
            {cloudList.length===0&&<div style={{textAlign:"center",padding:20,color:T.dim,fontSize:12}}>Nenhum perfil salvo ainda na nuvem.</div>}

              <button key={p.id} onClick={()=>loadProfile(p.id)} disabled={fbBusy}
                style={{textAlign:"left",padding:"10px 14px",borderRadius:9,border:`1px solid ${T.border}`,background:T.white,cursor:fbBusy?"default":"pointer",opacity:fbBusy?.6:1}}
                onMouseEnter={e=>!fbBusy&&(e.currentTarget.style.borderColor=T.indigo)} onMouseLeave={e=>e.currentTarget.style.borderColor=T.border}>
                <div style={{fontWeight:700,fontSize:13,color:T.text}}>☁️ {p.id}</div>
                <div style={{fontSize:11,color:T.dim,marginTop:2}}>{p.userName} · {p.txCount} lançamento{p.txCount===1?"":"s"}{p.updatedAt?` · atualizado em ${new Date(p.updatedAt).toLocaleString("pt-BR")}`:""}</div>
              </button>
            ))}
          </>
        )}
        <div style={{borderTop:`1px solid ${T.border}`,paddingTop:12,marginTop:4}}>
          <Label>Ou digite o nome do perfil</Label>
          <div style={{display:"flex",gap:8}}>
            <Inp value={cloudNameV} onChange={e=>setCloudNameV(e.target.value)} placeholder="Ex: Pessoal, Empresa..." onKeyDown={e=>e.key==="Enter"&&loadProfile(cloudNameV.trim())}/>
            <Btn onClick={()=>loadProfile(cloudNameV.trim())} disabled={fbBusy||!cloudNameV.trim()} style={{whiteSpace:"nowrap"}}>{fbBusy?"⏳":"Carregar"}</Btn>
          </div>
        </div>
      </div>
    </Modal>
  );
  const isFut=month>mNow();

  if(!loaded)return(
    <div style={{background:T.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      {toast&&<div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:toast.c,color:"#fff",padding:"10px 20px",borderRadius:10,fontWeight:600,fontSize:13,zIndex:999,boxShadow:"0 4px 16px rgba(0,0,0,.15)"}}>{toast.msg}</div>}
      <div style={{marginBottom:12,fontSize:40}}>💰</div>
      <div style={{fontSize:24,fontWeight:800,color:T.indigo,marginBottom:6,letterSpacing:"-1px"}}>FinControl Pro</div>
      <div style={{fontSize:13,color:T.sub,marginBottom:40}}>Controle financeiro pessoal</div>
      <div style={{display:"flex",flexDirection:"column",gap:10,width:"100%",maxWidth:320}}>
        <Btn onClick={()=>fileRef.current.click()} style={{padding:16,fontSize:14,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>📂 Abrir arquivo .json</Btn>
        <Btn variant="ghost" onClick={openCloudList} disabled={fbBusy} style={{padding:14,fontSize:13,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>☁️ Carregar do Firebase</Btn>
        <Btn variant="ghost" onClick={newFile} style={{padding:14,fontSize:13,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>📄 Criar novo arquivo</Btn>
      </div>
      <div style={{marginTop:24,background:T.white,borderRadius:12,padding:16,maxWidth:320,width:"100%",border:`1px solid ${T.border}`,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Como funciona</p>
        <p style={{fontSize:12,color:T.dim,lineHeight:1.7}}>Clique <strong style={{color:T.text}}>Salvar</strong> para gravar num perfil seu no Firebase (ex: "Pessoal", "Empresa").<br/>Use <strong style={{color:T.text}}>Carregar do Firebase</strong> para ver a lista de perfis salvos e continuar de qualquer dispositivo.<br/>O ícone de download baixa um <strong style={{color:T.text}}>.json</strong> de backup quando quiser.</p>
      </div>
      <input ref={fileRef} type="file" accept=".json" onChange={loadFile} style={{display:"none"}}/>
      {cloudModalEl}
    </div>
  );

  return(
    <div style={{background:T.bg,minHeight:"100vh",color:T.text,width:"100%",display:"flex"}}>
      {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:toast.c,color:"#fff",padding:"10px 22px",borderRadius:10,fontWeight:600,fontSize:13,zIndex:999,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,.15)"}}>{toast.msg}</div>}

      {/* SIDEBAR */}
      <aside style={{background:T.side,width:216,flexShrink:0,minHeight:"100vh",position:"sticky",top:0,alignSelf:"flex-start",display:"flex",flexDirection:"column",padding:"20px 12px",borderRight:`1px solid ${T.sideBorder}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"0 8px 22px"}}>
          <span style={{fontSize:19}}>💰</span>
          <span style={{fontSize:15,fontWeight:600,color:T.sideText,letterSpacing:"-.2px",fontFamily:"'Space Grotesk','Inter',sans-serif"}}>FinControl</span>
        </div>
        <nav style={{display:"flex",flexDirection:"column",gap:2}}>
          {TABS.map((t,i)=>(
            <button key={t} onClick={()=>setTab(i)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,fontSize:13,fontWeight:tab===i?600:400,border:"none",borderLeft:`2px solid ${tab===i?T.amber:"transparent"}`,cursor:"pointer",background:tab===i?T.sideActive:"transparent",color:tab===i?"#F2F3F5":T.sideDim,transition:"all .15s",position:"relative",textAlign:"left"}}
              onMouseEnter={e=>tab!==i&&(e.currentTarget.style.background="rgba(255,255,255,.03)")} onMouseLeave={e=>tab!==i&&(e.currentTarget.style.background="transparent")}>
              <Icon name={TAB_ICONS[i]} size={16}/>
              <span style={{flex:1}}>{t}</span>
              {i===3&&overdue>0&&<span style={{background:T.red,color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{overdue}</span>}

          {editName?(

          ):(
            <button onClick={()=>{setNameV(state.userName);setEditName(true);}} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:T.sideDim,cursor:"pointer",fontSize:12,padding:"6px 8px",borderRadius:6,width:"100%",textAlign:"left"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.04)"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
              <span style={{width:22,height:22,borderRadius:"50%",background:"rgba(255,255,255,.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:600,color:"#E7E9EE",flexShrink:0}}>{(state.userName||"?").slice(0,1).toUpperCase()}</span>

            </button>
          )}

      {/* CONTEÚDO */}

            <span style={{fontSize:11,color:dirty?T.amber:T.dim,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{jFile}</span>
            {dirty&&<span style={{fontSize:9,color:T.amber,fontWeight:700}}>· não salvo</span>}
          </div>

          <button onClick={renameProfile} title="Clique para renomear o perfil na nuvem" style={{display:"flex",alignItems:"center",gap:5,background:T.indigoBg,borderRadius:6,padding:"4px 10px",border:`1px solid ${T.indigo}22`,flexShrink:0,cursor:"pointer",color:T.indigo,fontSize:11,fontWeight:600}}>

          <div style={{display:"flex",gap:6,marginLeft:"auto",alignItems:"center"}}>
            <Btn variant="ghost" onClick={()=>setCatMod(true)} title="Categorias" style={{padding:"6px 9px"}}><Icon name="tag" size={14}/></Btn>
            <Btn variant="ghost" onClick={()=>setPayAccMod(true)} title="Contas de pagamento" style={{padding:"6px 9px"}}><Icon name="wallet" size={14}/></Btn>
            <div style={{width:1,height:18,background:T.border,margin:"0 2px"}}/>
            <Btn onClick={genPdf} color={T.purple} style={{padding:"6px 12px",fontSize:12,display:"flex",alignItems:"center",gap:6}}><Icon name="print" size={13}/>PDF</Btn>

            <Btn variant="ghost" onClick={openCloudList} disabled={fbBusy} title="Trocar de perfil na nuvem" style={{padding:"6px 9px"}}><Icon name="cloud" size={14}/></Btn>
            <Btn variant="ghost" onClick={()=>fileRef.current.click()} title="Abrir arquivo .json" style={{padding:"6px 9px"}}><Icon name="folder" size={14}/></Btn>
            <input ref={fileRef} type="file" accept=".json" onChange={loadFile} style={{display:"none"}}/>
          </div>
        </div>

        <main style={{width:"100%",padding:"24px 28px 48px",flex:1}}>

        {/* ── DASHBOARD ── */}
        {tab===0&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:22,alignItems:"center"}}>
              <h1 style={{fontSize:20,fontWeight:800,flex:1,letterSpacing:"-.5px",color:T.text}}>Visão Geral</h1>
              <input type="month" value={month} onChange={e=>setMonth(e.target.value)} style={{...inp,width:"auto",padding:"6px 10px",fontSize:12}}/>
            </div>

            {isFut&&<div style={{background:T.indigoBg,border:`1px solid #c7d2fe`,borderRadius:10,padding:"9px 14px",marginBottom:18,fontSize:12,color:T.indigo,fontWeight:500}}>🔮 Mês futuro — inclui projeções de recorrentes e parcelas</div>}
            {overBudgetCats.length>0&&<div style={{background:T.redBg,border:`1px solid ${T.red}44`,borderRadius:10,padding:"9px 14px",marginBottom:18,fontSize:12,color:T.red,fontWeight:600}}>⚠️ {overBudgetCats.length} categoria{overBudgetCats.length>1?"s":""} acima do limite: {overBudgetCats.map(c=>c.name).join(", ")}</div>}

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:12,marginBottom:22}}>
              <KPI label="Receitas" value={fmtBRL(incomes)} color={T.green} icon="📈"/>
              <KPI label="Gastos" value={fmtBRL(expenses)} color={T.red} icon="📉"/>
              <KPI label="Saldo" value={fmtBRL(balance)} color={balance>=0?T.indigo:T.red} icon="💳"/>
              <KPI label="Saúde" value={savRate.toFixed(1)+"%"} color={health.c} icon="🏦" sub={health.l}/>
              {assets.length>0&&<KPI label="Patrimônio líquido" value={fmtBRL(netWorth)} color={netWorth>=0?T.indigo:T.red} icon="🏦" onClick={()=>setTab(5)}/>}
              {bills.length>0&&<KPI label="Contas a Pagar" value={`${billsPaid}/${bills.length}`} color={overdue>0?T.red:bills.length-billsPaid>0?T.amber:T.green} icon="📅" sub={fmtBRL(billsPaidT)+" pago"} onClick={()=>setTab(3)}/>}
            </div>

            <Card style={{marginBottom:18}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <p style={{fontSize:11,fontWeight:700,color:T.sub,textTransform:"uppercase",letterSpacing:.5}}>Receitas vs Gastos</p>
                <p style={{fontSize:11,color:T.dim}}>últimos 6 meses + projeção</p>
              </div>
              <BarChart data={chartData} onMonthClick={m=>{setMonth(m);}}/>
            </Card>

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:16}}>
              {catIncT.length>0&&<Card>
                <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:14,textTransform:"uppercase",letterSpacing:.5}}>📈 Receitas{isFut?" · projetado":""}</p>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8,marginBottom:14}}>
                  {catIncT.map(c=><div key={c.id} style={{background:T.muted,borderRadius:8,padding:"10px 12px",borderLeft:`3px solid ${c.color}`}}>
                    <div style={{fontSize:10,color:T.sub,marginBottom:2}}>{c.icon} {c.name}</div>
                    <div style={{fontSize:14,fontWeight:700,color:c.color}}>{fmtBRL(c.val)}</div>
                    <div style={{fontSize:10,color:T.dim}}>{incomes>0?(c.val/incomes*100).toFixed(0):0}%</div>
                  </div>)}
                </div>
                {catIncT.map(c=><div key={c.id} style={{marginBottom:9}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:T.text}}>{c.icon} {c.name}</span><span style={{color:c.color,fontWeight:700}}>{fmtBRL(c.val)}</span></div>
                  <Bar pct={incomes>0?c.val/incomes*100:0} color={c.color}/>
                </div>)}
              </Card>}

              <Card>
                <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:14,textTransform:"uppercase",letterSpacing:.5}}>📉 Gastos por Categoria{isFut?" · projetado":""}</p>
                {catExpT.length===0?<p style={{color:T.dim,fontSize:12,padding:"12px 0"}}>Nenhum gasto neste mês.</p>:catExpT.map(c=><div key={c.id} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:T.text}}>{c.icon} {c.name}</span><div style={{display:"flex",gap:8}}><span style={{color:T.dim,fontSize:11}}>{expenses>0?(c.val/expenses*100).toFixed(0):0}%</span><span style={{color:c.color,fontWeight:700}}>{fmtBRL(c.val)}</span></div></div>
                  <Bar pct={expenses>0?c.val/expenses*100:0} color={c.color}/>
                </div>)}
              </Card>

              {payExpT.length>0&&<Card>
                <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:14,textTransform:"uppercase",letterSpacing:.5}}>💳 Por conta de pagamento</p>
                {payExpT.map(p=><div key={p.id} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:T.text}}>{p.icon} {p.name}</span><div style={{display:"flex",gap:8}}><span style={{color:T.dim,fontSize:11}}>{expenses>0?(p.val/expenses*100).toFixed(0):0}%</span><span style={{color:p.color,fontWeight:700}}>{fmtBRL(p.val)}</span></div></div>
                  <Bar pct={expenses>0?p.val/expenses*100:0} color={p.color}/>
                </div>)}
              </Card>}

              {budgetCats.length>0&&<Card>
                <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:14,textTransform:"uppercase",letterSpacing:.5}}>🎯 Orçamento por categoria</p>
                {budgetCats.map(c=><div key={c.id} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                    <span style={{color:T.text}}>{c.icon} {c.name}</span>
                    <span style={{color:c.over?T.red:T.dim,fontWeight:700}}>{fmtBRL(c.val)} <span style={{color:T.dim,fontWeight:400}}>/ {fmtBRL(c.budget)}</span></span>
                  </div>
                  <Bar pct={c.pct} color={c.over?T.red:c.color}/>
                  {c.over&&<div style={{fontSize:10,color:T.red,marginTop:3,fontWeight:600}}>⚠️ {fmtBRL(c.val-c.budget)} acima do limite</div>}
                </div>)}
              </Card>}
            </div>
          </div>
        )}

        {/* ── LANÇAMENTOS ── */}
        {tab===1&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
              <h1 style={{fontSize:20,fontWeight:800,flex:1,letterSpacing:"-.5px"}}>Lançamentos</h1>
              <input type="month" value={month} onChange={e=>setMonth(e.target.value)} style={{...inp,width:"auto",padding:"6px 10px",fontSize:12}}/>
              <Sel value={catF} onChange={e=>setCatF(e.target.value)} style={{width:"auto",padding:"6px 10px",fontSize:12}}>
                <option value="all">Categoria: todas</option>
                <optgroup label="── Gastos">{expCats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</optgroup>
                <optgroup label="── Receitas">{incCats.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</optgroup>
              </Sel>
              <Sel value={payF} onChange={e=>setPayF(e.target.value)} style={{width:"auto",padding:"6px 10px",fontSize:12}}>
                <option value="all">Conta: todas</option>
                {payAccs.map(p=><option key={p.id} value={p.id}>{p.icon} {p.name}</option>)}
              </Sel>
              <button onClick={()=>setSortMode(s=>s==="date"?"paycat":"date")} title="Alternar ordenação" style={{padding:"6px 11px",borderRadius:7,border:`1px solid ${sortMode==='paycat'?T.indigo:T.border}`,background:sortMode==="paycat"?T.indigoBg:T.white,color:sortMode==="paycat"?T.indigo:T.sub,cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>
                {sortMode==="paycat"?"💳 Conta+Categoria":"📅 Por data"}
              </button>
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:T.sub,cursor:"pointer",userSelect:"none"}}>
                <input type="checkbox" checked={showProj} onChange={e=>setShowProj(e.target.checked)} style={{accentColor:T.indigo}}/>
                🔮 Projeções
              </label>
              <Btn onClick={()=>openNewTx("expense")} color={T.red} style={{padding:"7px 14px",fontSize:12}}>+ Gasto</Btn>
              <Btn onClick={()=>openNewTx("income")} color={T.green} style={{padding:"7px 14px",fontSize:12}}>+ Receita</Btn>
            </div>

            {/* Totais da seleção atual */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
              {[
                {l:"Gastos"+(catF!=="all"||payF!=="all"?" (filtrado)":""),v:fmtBRL(filteredExp),c:T.red},
                {l:"Receitas"+(catF!=="all"||payF!=="all"?" (filtrado)":""),v:fmtBRL(filteredInc),c:T.green},
                {l:"Saldo",v:fmtBRL(filteredInc-filteredExp),c:filteredInc-filteredExp>=0?T.indigo:T.red},
              ].map(s=><div key={s.l} style={{background:T.white,borderRadius:9,padding:"10px 14px",border:`1px solid ${T.border}`,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
                <div style={{fontSize:10,color:T.dim,textTransform:"uppercase",letterSpacing:.4,fontWeight:600,marginBottom:3}}>{s.l}</div>
                <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
                <div style={{fontSize:10,color:T.dim,marginTop:2}}>{filteredTx.filter(t=>t.type===(s.l.startsWith("G")?"expense":"income")).length} lançamentos</div>
              </div>)}
            </div>

            {isFut&&<div style={{background:T.indigoBg,border:"1px solid #c7d2fe",borderRadius:10,padding:"8px 14px",marginBottom:14,fontSize:12,color:T.indigo}}>🔮 Itens tracejados são projeções automáticas</div>}

            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {filteredTx.length===0&&<div style={{textAlign:"center",padding:56,color:T.dim}}>Nenhum lançamento em {month}.</div>}
              {filteredTx.map(t=>{
                const cat=catById(t.catId),pay=payById(t.payAccId);
                const isP=!!t.isProj;
                return<div key={String(t.id)} style={{background:T.white,borderRadius:10,padding:"12px 16px",border:`1px solid ${isP?'#c7d2fe':T.border}`,borderStyle:isP?"dashed":"solid",display:"flex",alignItems:"center",gap:12,boxShadow:isP?"none":"0 1px 3px rgba(0,0,0,.04)",transition:"box-shadow .2s"}}
                  onMouseEnter={e=>!isP&&(e.currentTarget.style.boxShadow="0 4px 12px rgba(0,0,0,.07)")} onMouseLeave={e=>!isP&&(e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,.04)")}>
                  <div style={{width:38,height:38,borderRadius:9,background:(cat?.color||T.dim)+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>
                    {cat?.icon||"📦"}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3,color:T.text}}>
                      {t.desc}
                      {t.installments>1&&<Chip color={T.blue}>{t.installmentOf}/{t.installments}x</Chip>}
                      {t.recurring&&<Chip color={T.green}>🔄 recorrente</Chip>}
                      {isP&&<Chip color={T.indigo}>🔮 projeção</Chip>}
                      {t.dedupCard&&<Chip color={T.amber}>{t.dedupCardAmount?`🚫 cartão: ${fmtBRL(t.dedupCardAmount)}`:"🚫 cartão: total"}</Chip>}
                    </div>
                    <div style={{fontSize:11,color:T.dim,display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}}>
                      {cat&&<Chip color={cat.color} style={{fontSize:10}}>{cat.icon} {cat.name}</Chip>}
                      {pay&&<Chip color={pay.color} style={{fontSize:10}}>{pay.icon} {pay.name}</Chip>}
                      <span>{t.date}</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontWeight:700,color:t.type==="income"?T.green:T.red,fontSize:15,letterSpacing:"-.3px"}}>
                      {t.type==="income"?"+":"-"}{fmtBRL(t.amount)}
                    </div>
                    {t.dedupCard&&<div style={{fontSize:10,color:T.amber,fontWeight:600,marginTop:1}}>
                      líquido: {fmtBRL(effAmount(t))}
                    </div>}
                  </div>
                  {(!isP||(isP&&t.projType==="inst"))&&<div style={{display:"flex",gap:2,flexShrink:0}}>
                    <button onClick={()=>openEditTx(t)} title={isP?"Editar todas as parcelas":"Editar"} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:14,padding:"4px 5px",borderRadius:5}} onMouseEnter={e=>e.currentTarget.style.background=T.muted} onMouseLeave={e=>e.currentTarget.style.background="none"}>✏️</button>
                    {!isP&&<button onClick={()=>delTx(t)} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:14,padding:"4px 5px",borderRadius:5}} onMouseEnter={e=>e.currentTarget.style.background=T.redBg} onMouseLeave={e=>e.currentTarget.style.background="none"}>🗑</button>}
                    {(t.groupId||isP)&&<button onClick={()=>delGrp(t)} style={{background:"none",border:"none",color:T.red,cursor:"pointer",fontSize:9,padding:"4px",borderRadius:5,fontWeight:700}} onMouseEnter={e=>e.currentTarget.style.background=T.redBg} onMouseLeave={e=>e.currentTarget.style.background="none"}>all✕</button>}
                  </div>}
                </div>;
              })}
            </div>
          </div>
        )}

        {/* ── METAS ── */}
        {tab===2&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:22,alignItems:"center"}}>
              <h1 style={{fontSize:20,fontWeight:800,flex:1,letterSpacing:"-.5px"}}>Metas & Viagens</h1>
              <Btn onClick={openNewGoal} style={{padding:"7px 16px",fontSize:12}}>+ Nova Meta</Btn>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
              {state.goals.length===0&&<div style={{textAlign:"center",padding:56,color:T.dim,gridColumn:"1/-1"}}>Nenhuma meta ainda. 🎯</div>}
              {state.goals.map(g=>{
                const pct=g.target>0?Math.min(g.saved/g.target*100,100):0,rem=g.target-g.saved,gc=GOAL_C[g.type]||T.indigo;
                let dL=null,mL=null;if(g.deadline){const diff=new Date(g.deadline)-new Date();dL=Math.ceil(diff/86400000);mL=diff/(30*86400000);}
                const cl=g.checklist||[],done=cl.filter(i=>i.status!=="open").length,clPaid=cl.filter(i=>i.status==="paid").reduce((a,i)=>a+(i.amount||0),0);
                return<Card key={g.id} style={{border:`1px solid ${T.border}`,transition:"box-shadow .2s"}} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 4px 16px rgba(0,0,0,.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,.04)"}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:14}}>
                    <span style={{fontSize:24}}>{GOAL_META[g.type]}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14,marginBottom:2,color:T.text}}>{g.name}</div>
                      {g.deadline&&<div style={{fontSize:11,color:dL!==null&&dL<30?T.red:T.dim}}>📅 {g.deadline}{dL!==null&&` · ${dL>0?dL+' dias':'Vencida'}`}</div>}
                    </div>
                    <div style={{display:"flex",gap:3}}>
                      <button onClick={()=>openEditGoal(g)} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:14,padding:"2px 5px",borderRadius:5}} onMouseEnter={e=>e.currentTarget.style.background=T.muted} onMouseLeave={e=>e.currentTarget.style.background="none"}>✏️</button>
                      <button onClick={()=>upd({goals:state.goals.filter(x=>x.id!==g.id)})} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:14,padding:"2px 5px",borderRadius:5}} onMouseEnter={e=>e.currentTarget.style.background=T.redBg} onMouseLeave={e=>e.currentTarget.style.background="none"}>🗑</button>
                    </div>
                  </div>
                  <div style={{display:"flex",justifyContent:"flex-end",fontSize:11,color:gc,fontWeight:700,marginBottom:3}}>{pct.toFixed(0)}%</div>
                  <Bar pct={pct} color={gc} h={8}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,margin:"8px 0 4px"}}>
                    <span><span style={{color:gc,fontWeight:700}}>{fmtBRL(g.saved)}</span> <span style={{color:T.dim}}>guardado</span></span>
                    <span style={{color:T.dim}}>Meta: {fmtBRL(g.target)}</span>
                  </div>
                  <div style={{fontSize:11,color:T.dim,marginBottom:12}}>Falta: <span style={{color:T.amber,fontWeight:700}}>{fmtBRL(rem)}</span>{mL!==null&&mL>0&&rem>0&&<span> · <span style={{color:T.text,fontWeight:600}}>{fmtBRL(rem/mL)}/mês</span> para bater</span>}</div>
                  {g.notes&&<div style={{background:T.muted,borderRadius:8,padding:"9px 11px",fontSize:11,color:T.sub,marginBottom:10,whiteSpace:"pre-wrap",wordBreak:"break-word",border:`1px solid ${T.border}`}}>📝 {g.notes}</div>}
                  {cl.length>0&&<div style={{background:T.muted,borderRadius:8,padding:"8px 11px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",border:`1px solid ${T.border}`,transition:"border-color .15s"}} onClick={()=>setChkGoal(g)} onMouseEnter={e=>e.currentTarget.style.borderColor=gc} onMouseLeave={e=>e.currentTarget.style.borderColor=T.border}>
                    <span style={{fontSize:12,color:T.sub}}>📋 <span style={{color:gc,fontWeight:700}}>{done}/{cl.length}</span> itens</span>
                    <span style={{fontSize:11,color:T.green,fontWeight:700}}>{fmtBRL(clPaid)} pago</span>
                  </div>}
                  <div style={{display:"flex",gap:6}}>
                    {pct<100&&<Btn onClick={()=>{setDepMod(g);setDepVal("");}} color={gc} style={{flex:1,padding:"8px",fontSize:12}}>+ Depositar</Btn>}
                    <Btn variant="ghost" onClick={()=>setChkGoal(g)} style={{flex:1,padding:"8px",fontSize:12}}>📋{cl.length>0&&` (${cl.length})`}</Btn>
                  </div>
                  {pct>=100&&<div style={{textAlign:"center",padding:8,background:T.greenBg,borderRadius:8,color:T.green,fontWeight:700,fontSize:12,marginTop:8,border:`1px solid #a7f3d0`}}>✅ Meta atingida!</div>}
                </Card>;
              })}
            </div>
          </div>
        )}

        {/* ── CONTAS ── */}

            <div>

                <button onClick={()=>setTxF(f=>({...f,dedupCardAmount:f.dedupCardAmount||""}))} style={{padding:"6px 10px",borderRadius:7,border:`2px solid ${txF.dedupCardAmount?T.amber:T.border}`,background:txF.dedupCardAmount?T.amberBg:"transparent",color:txF.dedupCardAmount?T.amber:T.sub,cursor:"pointer",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>

          </label>}
          {txF.type==="expense"&&<div style={{background:T.muted,borderRadius:10,padding:14,border:`1px solid ${T.border}`}}>
            <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:12,textTransform:"uppercase",letterSpacing:.4}}>Parcelamento</p>
            {txMod==="new"&&<div style={{display:"flex",gap:7,marginBottom:12}}>
              {[{v:"new",l:"🆕 Compra nova",d:"Começa na parcela 1"},{v:"mid",l:"📍 Já em andamento",d:"Entro no meio"}].map(o=><button key={o.v} onClick={()=>setTxF(f=>({...f,installMode:o.v,startInst:o.v==="new"?"1":f.startInst}))} style={{flex:1,padding:"9px 6px",borderRadius:8,border:`2px solid ${txF.installMode===o.v?T.indigo:T.border}`,background:txF.installMode===o.v?T.indigoBg:"transparent",color:txF.installMode===o.v?T.indigo:T.sub,cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
                <div style={{fontWeight:700,fontSize:11}}>{o.l}</div><div style={{fontSize:10,opacity:.7,marginTop:2}}>{o.d}</div>
              </button>)}
            </div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label style={{fontSize:11,color:T.sub,marginBottom:5,display:"block"}}>Total de parcelas</label><Inp type="number" min="1" max="120" value={txF.installments} onChange={e=>setTxF(f=>({...f,installments:e.target.value}))} placeholder="Ex: 12"/></div>
              <div><label style={{fontSize:11,color:T.sub,marginBottom:5,display:"block"}}>{txMod==="new"&&txF.installMode==="mid"?"Estou na parcela nº":"Parcela inicial"}</label><Inp type="number" min="1" max={txF.installments||120} value={txF.startInst} onChange={e=>setTxF(f=>({...f,startInst:e.target.value}))} placeholder="1"/></div>
            </div>
            {parseInt(txF.installments)>1&&(()=>{const tot=parseInt(txF.installments)||0,st=parseInt(txF.startInst)||1,rem=tot-st+1;return<div style={{marginTop:10,padding:"9px 12px",background:st===1?T.greenBg:T.amberBg,borderRadius:8,fontSize:11,border:`1px solid ${st===1?'#a7f3d0':'#fcd34d'}`,color:st===1?T.green:T.amber,fontWeight:600}}>{st===1?`✅ ${tot} parcelas de ${fmtBRL(parseFloat(txF.amount||0))}`:`📍 Parcela ${st}/${tot}: ${rem} restantes de ${fmtBRL(parseFloat(txF.amount||0))}`}</div>})()}
          </div>}
        </div>
        <div style={{display:"flex",gap:8,marginTop:18}}><Btn onClick={saveTx} style={{flex:1,padding:10}}>Salvar lançamento</Btn><Btn variant="ghost" onClick={()=>setTxMod(false)} style={{padding:"10px 16px"}}>Cancelar</Btn></div>
      </Modal>}

      {goalMod&&<Modal title={goalMod==="new"?"Nova Meta":"Editar Meta"} onClose={()=>setGoalMod(false)}>
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div><Label>Tipo</Label><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{Object.entries(GOAL_META).map(([k,ic])=><button key={k} onClick={()=>setGoalF(f=>({...f,type:k}))} style={{flex:1,minWidth:70,padding:"8px 4px",borderRadius:8,border:`2px solid ${goalF.type===k?GOAL_C[k]:T.border}`,background:goalF.type===k?GOAL_C[k]+"18":"transparent",color:goalF.type===k?GOAL_C[k]:T.sub,cursor:"pointer",fontWeight:700,fontSize:11,transition:"all .15s"}}>{ic} {k==="goal"?"Meta":k==="travel"?"Viagem":k==="purchase"?"Compra":"Reserva"}</button>)}</div></div>
          <div><Label>Nome *</Label><Inp value={goalF.name} onChange={e=>setGoalF(f=>({...f,name:e.target.value}))} autoFocus/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Label>Valor Total *</Label><Inp type="number" value={goalF.target} onChange={e=>setGoalF(f=>({...f,target:e.target.value}))} placeholder="5000"/></div>
            <div><Label>Já guardado</Label><Inp type="number" value={goalF.saved} onChange={e=>setGoalF(f=>({...f,saved:e.target.value}))} placeholder="0"/></div>
          </div>
          <div><Label>Prazo</Label><Inp type="date" value={goalF.deadline} onChange={e=>setGoalF(f=>({...f,deadline:e.target.value}))}/></div>
          <div><Label>Anotações</Label><textarea value={goalF.notes} onChange={e=>setGoalF(f=>({...f,notes:e.target.value}))} rows={3} style={{...inp,resize:"vertical"}}/></div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:16}}><Btn onClick={saveGoal} style={{flex:1,padding:10}}>Salvar</Btn><Btn variant="ghost" onClick={()=>setGoalMod(false)} style={{padding:"10px 16px"}}>Cancelar</Btn></div>
      </Modal>}

      {depMod&&<Modal title={`Depositar — ${depMod.name}`} onClose={()=>setDepMod(null)}>
        <p style={{fontSize:12,color:T.dim,marginBottom:12}}>Guardado: {fmtBRL(depMod.saved)} / {fmtBRL(depMod.target)}</p>
        <Inp type="number" value={depVal} onChange={e=>setDepVal(e.target.value)} placeholder="Valor" autoFocus/>
        <div style={{display:"flex",gap:8,marginTop:16}}><Btn onClick={doDep} color={T.green} style={{flex:1,padding:10}}>Confirmar</Btn><Btn variant="ghost" onClick={()=>setDepMod(null)} style={{padding:"10px 16px"}}>Cancelar</Btn></div>
      </Modal>}

      {chkGoal&&<ChkModal goal={state.goals.find(g=>g.id===chkGoal.id)||chkGoal} onClose={()=>setChkGoal(null)} onUpdate={updGoal}/>}

      {billMod&&<Modal title={editBillId?"Editar Conta":"Nova Conta Fixa"} onClose={()=>{setBillMod(false);setBillF(blankBill);setEditBillId(null);}}>
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div><Label>Nome *</Label><Inp value={billF.name} onChange={e=>setBillF(f=>({...f,name:e.target.value}))} placeholder="Ex: Aluguel, Internet..." autoFocus/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Label>Valor *</Label><Inp type="number" value={billF.amount} onChange={e=>setBillF(f=>({...f,amount:e.target.value}))} placeholder="0,00"/></div>
            <div><Label>Vencimento</Label><Sel value={billF.dueDay} onChange={e=>setBillF(f=>({...f,dueDay:parseInt(e.target.value)}))}>{DUE_DAYS.map(d=><option key={d} value={d}>Dia {d}</option>)}</Sel></div>
          </div>
          <div><Label>Categoria</Label><Sel value={billF.category} onChange={e=>setBillF(f=>({...f,category:e.target.value}))}>{BILL_CATS.map(c=><option key={c}>{c}</option>)}</Sel></div>
          <div style={{background:T.muted,borderRadius:8,padding:"9px 12px",fontSize:11,color:T.sub,border:`1px solid ${T.border}`}}>💡 Cadastre uma vez — aparece no checklist todo mês.</div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:16}}><Btn onClick={saveBill} style={{flex:1,padding:10}}>Salvar</Btn><Btn variant="ghost" onClick={()=>{setBillMod(false);setBillF(blankBill);setEditBillId(null);}} style={{padding:"10px 16px"}}>Cancelar</Btn></div>
      </Modal>}

      {assetMod&&<Modal title={editAssetId?"Editar Item":"Novo Item de Patrimônio"} onClose={()=>{setAssetMod(false);setAssetF(blankAsset);setEditAssetId(null);}}>
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          <div><Label>Tipo</Label><div style={{display:"flex",gap:6}}>{ASSET_TYPES.map(t=><button key={t.v} onClick={()=>setAssetF(f=>({...f,type:t.v}))} style={{flex:1,padding:"8px 4px",borderRadius:8,border:`2px solid ${assetF.type===t.v?t.color:T.border}`,background:assetF.type===t.v?t.color+"18":"transparent",color:assetF.type===t.v?t.color:T.sub,cursor:"pointer",fontWeight:600,fontSize:11,textAlign:"center"}}>{t.icon} {t.l}</button>)}</div></div>
          <div><Label>Nome *</Label><Inp value={assetF.name} onChange={e=>setAssetF(f=>({...f,name:e.target.value}))} placeholder="Ex: Poupança Nubank, Tesouro Direto..." autoFocus/></div>
          <div><Label>Valor atual *</Label><Inp type="number" value={assetF.value} onChange={e=>setAssetF(f=>({...f,value:e.target.value}))} placeholder="0,00"/></div>
          <div><Label>Observações</Label><textarea value={assetF.notes} onChange={e=>setAssetF(f=>({...f,notes:e.target.value}))} rows={2} style={{...inp,resize:"vertical"}}/></div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:16}}><Btn onClick={saveAsset} style={{flex:1,padding:10}}>Salvar</Btn><Btn variant="ghost" onClick={()=>{setAssetMod(false);setAssetF(blankAsset);setEditAssetId(null);}} style={{padding:"10px 16px"}}>Cancelar</Btn></div>
      </Modal>}

      {payAccMod&&<Modal title="💳 Contas de Pagamento" onClose={()=>{setPayAccMod(false);setPayFrm(blankPay);setEditPayId(null);}} wide>
        <p style={{fontSize:12,color:T.sub,marginBottom:14}}>Cartões e formas de pagamento. Use como 2ª classificação nos lançamentos.</p>
        <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14,maxHeight:200,overflowY:"auto"}}>
          {payAccs.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:10,background:T.muted,borderRadius:8,padding:"9px 13px",border:`1px solid ${T.border}`}}>
            <span style={{fontSize:18}}>{p.icon}</span><div style={{width:8,height:8,borderRadius:"50%",background:p.color,flexShrink:0}}/><span style={{flex:1,fontSize:13,fontWeight:600}}>{p.name}</span>
            <span style={{fontSize:10,color:T.dim}}>{state.transactions.filter(t=>t.payAccId===p.id).length} lançamentos</span>
            <button onClick={()=>{setPayFrm({name:p.name,icon:p.icon,color:p.color});setEditPayId(p.id);}} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:13}}>✏️</button>
            <button onClick={()=>{if(state.transactions.some(t=>t.payAccId===p.id)){alert("Possui lançamentos.");return;}upd({payAccounts:payAccs.filter(x=>x.id!==p.id)});}} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:13}}>🗑</button>
          </div>)}
        </div>
        <div style={{background:T.muted,borderRadius:10,padding:14,border:`1px solid ${editPayId?T.indigo:T.border}`}}>
          <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:10,textTransform:"uppercase",letterSpacing:.4}}>{editPayId?"Editando":"Nova conta"}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><Label>Nome</Label><Inp value={payFrm.name} onChange={e=>setPayFrm(f=>({...f,name:e.target.value}))} placeholder="Ex: Cartão Nubank"/></div>
            <div><Label>Ícone</Label><Inp value={payFrm.icon} onChange={e=>setPayFrm(f=>({...f,icon:e.target.value}))} placeholder="💳"/></div>
          </div>
          <Label>Cor</Label>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>{PALETTE.map(c=><button key={c} onClick={()=>setPayFrm(f=>({...f,color:c}))} style={{width:22,height:22,borderRadius:"50%",background:c,border:`3px solid ${payFrm.color===c?'#1e293b':'transparent'}`,cursor:"pointer"}}/>)}</div>
          <div style={{display:"flex",gap:7}}><Btn onClick={savePayAcc} style={{padding:"8px 18px",fontSize:12}}>{editPayId?"Salvar":"Criar"}</Btn>{editPayId&&<Btn variant="ghost" onClick={()=>{setPayFrm(blankPay);setEditPayId(null);}} style={{padding:"8px 12px",fontSize:12}}>Cancelar</Btn>}</div>
        </div>
      </Modal>}

      {catMod&&<Modal title="🏷️ Categorias" onClose={()=>{setCatMod(false);setCatFrm(blankCat);setEditCatId(null);}} wide>
        <div style={{display:"flex",gap:6,marginBottom:14}}>{["expense","income"].map(tp=><button key={tp} onClick={()=>{setCatType(tp);if(!editCatId)setCatFrm(f=>({...f,type:tp}));}} style={{padding:"6px 18px",borderRadius:7,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:catType===tp?(tp==="expense"?T.redBg:T.greenBg):"transparent",color:catType===tp?(tp==="expense"?T.red:T.green):T.dim,transition:"all .15s"}}>{tp==="expense"?"💸 Gastos":"💰 Receitas"}</button>)}</div>
        <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14,maxHeight:200,overflowY:"auto"}}>
          {cats.filter(c=>c.type===catType).map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:10,background:T.muted,borderRadius:8,padding:"8px 12px",border:`1px solid ${T.border}`}}>
            <span style={{fontSize:18}}>{c.icon}</span><div style={{width:8,height:8,borderRadius:"50%",background:c.color,flexShrink:0}}/><span style={{flex:1,fontSize:12,fontWeight:600}}>{c.name}</span>
            {c.budget>0&&<span style={{fontSize:10,color:T.amber,fontWeight:700}}>limite {fmtBRL(c.budget)}</span>}
            <span style={{fontSize:10,color:T.dim}}>{state.transactions.filter(t=>t.catId===c.id).length}</span>
            <button onClick={()=>{setCatFrm({name:c.name,icon:c.icon,color:c.color,type:c.type,budget:c.budget?String(c.budget):""});setEditCatId(c.id);}} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:13}}>✏️</button>
            <button onClick={()=>delCat(c.id)} style={{background:"none",border:"none",color:T.dim,cursor:"pointer",fontSize:13}}>🗑</button>
          </div>)}
        </div>
        <div style={{background:T.muted,borderRadius:10,padding:14,border:`1px solid ${editCatId?T.indigo:T.border}`}}>
          <p style={{fontSize:11,fontWeight:700,color:T.sub,marginBottom:10,textTransform:"uppercase",letterSpacing:.4}}>{editCatId?"Editando":"Nova categoria"}</p>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div><Label>Tipo</Label><div style={{display:"flex",gap:6}}>{["expense","income"].map(tp=><button key={tp} onClick={()=>setCatFrm(f=>({...f,type:tp}))} style={{flex:1,padding:"7px",borderRadius:7,border:`2px solid ${catFrm.type===tp?(tp==='expense'?T.red:T.green):T.border}`,background:catFrm.type===tp?(tp==="expense"?T.redBg:T.greenBg):"transparent",color:catFrm.type===tp?(tp==="expense"?T.red:T.green):T.sub,cursor:"pointer",fontWeight:700,fontSize:11,transition:"all .15s"}}>{tp==="expense"?"💸 Gasto":"💰 Receita"}</button>)}</div></div>
            <div><Label>Nome</Label><Inp value={catFrm.name} onChange={e=>setCatFrm(f=>({...f,name:e.target.value}))} placeholder="Ex: Salário PJ..."/></div>
            <div><Label>Ícone</Label><div style={{display:"flex",flexWrap:"wrap",gap:3}}>{EMOJIS.map(e=><button key={e} onClick={()=>setCatFrm(f=>({...f,icon:e}))} style={{width:30,height:30,borderRadius:6,border:`2px solid ${catFrm.icon===e?T.indigo:'transparent'}`,background:catFrm.icon===e?T.indigoBg:"transparent",cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",transition:"border-color .15s"}}>{e}</button>)}</div></div>
            <div><Label>Cor</Label><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{PALETTE.map(c=><button key={c} onClick={()=>setCatFrm(f=>({...f,color:c}))} style={{width:22,height:22,borderRadius:"50%",background:c,border:`3px solid ${catFrm.color===c?'#1e293b':'transparent'}`,cursor:"pointer"}}/>)}</div></div>
            {catFrm.type==="expense"&&<div><Label>Limite mensal (opcional)</Label><Inp type="number" value={catFrm.budget} onChange={e=>setCatFrm(f=>({...f,budget:e.target.value}))} placeholder="Ex: 800"/></div>}
          </div>
          <div style={{display:"flex",gap:7,marginTop:12}}><Btn onClick={savecat} style={{padding:"8px 18px",fontSize:12}}>{editCatId?"Salvar":"Criar"}</Btn>{editCatId&&<Btn variant="ghost" onClick={()=>{setCatFrm({...blankCat,type:catType});setEditCatId(null);}} style={{padding:"8px 12px",fontSize:12}}>Cancelar</Btn>}</div>
        </div>
      </Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
